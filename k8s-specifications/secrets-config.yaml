---
# Secret for PostgreSQL password
# Create with: kubectl create secret generic db-secret --from-literal=password=<your-secure-password>
# Or apply manually with a secure password below
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: default
  labels:
    app: db
type: Opaque
data:
  # Base64 encoded password. Change this!
  # Default: postgres (cG9zdGdyZXM=)
  # To generate: echo -n "your-password" | base64
  password: cG9zdGdyZXM=

---
# ConfigMap for application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: default
  labels:
    app: voting-app
data:
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  DB_HOST: "db"
  DB_PORT: "5432"
  DB_NAME: "votes"
  DB_USER: "postgres"
